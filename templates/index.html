<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIEDARZYNO</title>

    {{ url_for('static', filename='style.css') }}
</head>

<body>

    <div id="intro">

        <div class="intro-box">

            <h1>🕷️ NIEDARZYNO</h1>

            <p>Oficjalna strona społeczności</p>

            <button id="enterBtn">
                WEJDŹ
            </button>

        </div>

    </div>

    <video autoplay muted loop playsinline id="bg-video">
         }}" type="video/mp4">
    </video>

    <div class="overlay"></div>

    <div class="main-container">

        <div class="left-panel">

            <div class="hero-card">

                <h1>🕷️ NIEDARZYNO</h1>

                <p>Witaj na oficjalnej stronie Niedarzyno</p>

                <div class="status">
                    🟢 ONLINE
                </div>

                <a
                    href="https://discord.gg/dkZPcMeqMD"
                    target="_blank"
                    class="discord-btn">
                    💬 DISCORD
                </a>

            </div>

            <div class="form-card">

                <h2>✍️ Dodaj komentarz</h2>

                <form method="POST">

                    <input
                        type="text"
                        name="name"
                        maxlength="25"
                        placeholder="Twój nick"
                        required>

                    <textarea
                        name="message"
                        maxlength="300"
                        placeholder="Napisz komentarz..."
                        required></textarea>

                    <button type="submit">
                        DODAJ KOMENTARZ
                    </button>

                </form>

            </div>

        </div>

        <div class="comments-panel">

            <h2>💬 Komentarze</h2>

            <div class="comments">

                {% for comment in comments %}

                <div class="comment">

                    <div class="comment-header">
                        👤 {{ comment[0] }}
                    </div>

                    <div class="comment-body">
                        {{ comment[1] }}
                    </div>

                    <div class="comment-date">
                        🕒 {{ comment[2] }}
                    </div>

                </div>

                {% endfor %}

            </div>

        </div>

    </div>

    <script>

        const enterBtn = document.getElementById("enterBtn");
        const intro = document.getElementById("intro");
        const video = document.getElementById("bg-video");

        video.volume = 0.25;

        enterBtn.addEventListener("click", () => {

            video.muted = false;
            video.play();

            intro.classList.add("hide");

            setTimeout(() => {
                intro.remove();
            }, 700);

        });

    </script>

</body>

</html>
