<!DOCTYPE html>
<html>

<head>

<title>Niedarzyno</title>

<link rel="stylesheet" href="/static/style.css">

</head>


<body>


<video id="bg" autoplay loop muted playsinline>

<source src="/static/edit.mp4" type="video/mp4">

</video>


<div class="overlay"></div>



<div class="container">



<div class="card">


<h1>
🕷️ NIEDARZYNO
</h1>


<p>
Witaj na stronie Niedarzyno
</p>


<div class="status">
🟢 ONLINE
</div>



<a class="discord"
href="https://discord.gg/dkZPcMeqMD"
target="_blank">

💬 DISCORD

</a>




<h2>
✍️ Napisz komentarz
</h2>



<form method="POST">


<input
type="text"
name="name"
placeholder="Twój nick"
maxlength="25"
required>



<textarea
name="message"
placeholder="Napisz komentarz..."
maxlength="300"
required></textarea>



<button type="submit">
DODAJ KOMENTARZ
</button>



</form>


</div>





<div class="comments-box">


<h2>
💬 Komentarze
</h2>



<div class="comments">


{% for comment in comments %}


<div class="comment">


<h3>
👤 {{comment[0]}}
</h3>


<p>
{{comment[1]}}
</p>


<small>
🕒 {{comment[2]}}
</small>


</div>


{% endfor %}



</div>


</div>



</div>



</body>

</html>
